<button
    type="button"
    class="user-trigger"
    aria-label="Abrir menu do usuário"
    aria-haspopup="menu"
    [attr.aria-expanded]="menuAberto"
    (click)="alternarMenu($event)">

    <img
        class="user-trigger__photo"
        src="assets/img/avatar3.png"
        alt="Foto de {{ userName }}">
</button>

@if (menuAberto) {
    <section
        class="user-popover"
        role="menu"
        aria-label="Menu do usuário"
        (click)="$event.stopPropagation()">

        <header
            class="user-popover__identity">

            <img
                class="user-popover__photo"
                src="assets/img/avatar3.png"
                alt="">

            <div
                class="user-popover__details">

                <strong>
                    {{ userName }}
                </strong>

                <span>
                    {{ userEmail }}
                </span>
            </div>
        </header>

        <nav
            class="user-actions"
            aria-label="Ações do usuário">

            <button
                type="button"
                role="menuitem"
                class="user-action"
                (click)="executarAcaoEmBreve()">

                <i
                    class="far fa-user"
                    aria-hidden="true">
                </i>

                <span>Meu perfil</span>
            </button>

            <button
                type="button"
                role="menuitem"
                class="user-action"
                (click)="executarAcaoEmBreve()">

                <i
                    class="fas fa-cog"
                    aria-hidden="true">
                </i>

                <span>
                    Configurações da conta
                </span>
            </button>

            <button
                type="button"
                role="menuitem"
                class="user-action"
                (click)="executarAcaoEmBreve()">

                <i
                    class="fas fa-sliders-h"
                    aria-hidden="true">
                </i>

                <span>Preferências</span>
            </button>

            <button
                type="button"
                role="menuitem"
                class="
                    user-action
                    user-action--danger
                "
                (click)="logout()">

                <i
                    class="fas fa-sign-out-alt"
                    aria-hidden="true">
                </i>

                <span>Sair do sistema</span>
            </button>
        </nav>
    </section>
}
