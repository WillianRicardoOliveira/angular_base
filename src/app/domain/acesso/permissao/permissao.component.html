<app-cabecalho-pagina
    [pagina]="pagina"
    [descricao]="descricao"
    [breadcrumb]="breadcrumb">
</app-cabecalho-pagina>

@if (isLista) {
    <app-grid
        [totalRegistros]="totalRegistros"
        [lista]="lista"
        [coluna]="coluna"
        [placeholderPesquisa]="'Pesquisar permissões...'"
        [ariaLabelPesquisa]="'Pesquisar permissões'"
        [b_adicionar]="false"
        [b_editar]="false"
        [b_excluir]="false"
        [b_visualizar]="podeDetalhar"
        (pesquisa)="pesquisar($event)"
        (visualizar)="botaoVisualizar($event)"
        (p_paginacao)="quantidadePorPagina($event)">
    </app-grid>
}

<div class="formulario">
    <section class="content">
        @if (isFormulario && formulario) {
            <form [formGroup]="formulario">

                <div class="row">
                    <div
                        class="col-md-12 titulo-formulario">
                        Detalhes da permissão
                    </div>
                </div>

                @if (formulario.get('nome')) {
                    <div class="row">
                        <div class="col-md-2 titulo-campo">
                            Nome
                        </div>

                        <div class="col-md-10">
                            <mat-form-field
                                appearance="outline"
                                class="full-width">

                                <input
                                    matInput
                                    type="text"
                                    formControlName="nome"
                                    autocomplete="off">
                            </mat-form-field>
                        </div>
                    </div>
                }

                @if (formulario.get('chave')) {
                    <div class="row">
                        <div class="col-md-2 titulo-campo">
                            Chave
                        </div>

                        <div class="col-md-10">
                            <mat-form-field
                                appearance="outline"
                                class="full-width">

                                <input
                                    matInput
                                    type="text"
                                    formControlName="chave"
                                    autocomplete="off">
                            </mat-form-field>
                        </div>
                    </div>
                }

                @if (formulario.get('descricao')) {
                    <div class="row">
                        <div class="col-md-2 titulo-campo">
                            Descrição
                        </div>

                        <div class="col-md-10">
                            <mat-form-field
                                appearance="outline"
                                class="full-width">

                                <textarea
                                    matInput
                                    formControlName="descricao"
                                    rows="4">
                                </textarea>
                            </mat-form-field>
                        </div>
                    </div>
                }

                <div class="row">
                    <div class="col-md-12 botao">
                        <button
                            type="button"
                            mat-stroked-button
                            color="primary"
                            (click)="cancelar()">
                            Fechar
                        </button>
                    </div>
                </div>
            </form>
        }
    </section>
</div>
